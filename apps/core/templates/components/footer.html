{% load humanize %}
{% load static %}
<footer class="app-footer text-center py-3 mt-auto">
    <div class="container">
        <p class="mb-0">
            &copy; {{ current_year }} {{ app_name }} - {{ app_version }}
        </p>
        <small class="footer-subtitle">{{ app_description }}</small>
        <div class="footer-developer">
            <a href="https://banantechnology.com" target="_blank" rel="noopener noreferrer">
                <img src="{% static 'img/logo/logo-dark.png' %}" alt="بنان لتقنية المعلومات" class="footer-developer-logo logo-light">
                <img src="{% static 'img/logo/logo-white.png' %}" alt="بنان لتقنية المعلومات" class="footer-developer-logo logo-dark">
                <span>تطوير بنان لتقنية المعلومات</span>
            </a>
        </div>
    </div>
</footer>
